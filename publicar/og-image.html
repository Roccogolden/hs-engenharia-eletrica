<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Prévia do link (og:image, 1200 x 630). Tudo dentro do quadrado central de 630 px: o WhatsApp do computador recorta o centro.
     Assinatura: o retângulo de luz (perfil de LED) em volta do logo, como na abertura do site.
     Gerar: node "%USERPROFILE%/.claude/skills/site-agencia/scripts/renderizar-html.mjs" publicar/og-image.html - publicar/og-image.jpg 1200 630 88
     Informação que não envelhece: cidade e horário sim; nota do Google e preço não. -->
<style>
  @font-face { font-family: "Archivo"; src: url("../site/fonts/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #000; color: #f2f0eb; font-family: "Archivo", Arial, sans-serif; position: relative; }
  .luz { position: absolute; left: 50%; top: 56px; width: 470px; height: 330px; transform: translateX(-50%); }
  .luz svg { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); overflow: visible; }
  .luz .halo { fill: none; stroke: rgba(244, 184, 28, .28); stroke-width: 9; }
  .luz .fio { fill: none; stroke: #ffd978; stroke-width: 2.4; }
  .logo { position: absolute; left: 50%; top: 50%; width: 360px; transform: translate(-50%, -50%); }
  .texto { position: absolute; left: 0; right: 0; top: 420px; text-align: center; }
  .local { font-size: 19px; font-weight: 700; font-stretch: 118%; letter-spacing: .2em; text-transform: uppercase; color: #f4b81c; }
  .meta { margin-top: 14px; font-size: 21px; font-weight: 600; color: #c9c5bd; }
  .meta b { color: #f2f0eb; font-weight: 700; font-size: 23px; }
  .meta--hora { margin-top: 6px; font-size: 19px; }
</style></head>
<body>
  <div class="luz">
    <svg viewBox="0 0 494 354" preserveAspectRatio="none" aria-hidden="true">
      <rect class="halo" x="12" y="12" width="470" height="330"/>
      <rect class="fio" x="12" y="12" width="470" height="330"/>
    </svg>
    <img class="logo" src="../site/img/logo-hs.png" alt="">
  </div>
  <div class="texto">
    <p class="local">Senador Canedo – GO</p>
    <p class="meta"><b>Engenharia civil e elétrica</b></p>
    <p class="meta meta--hora">Seg a sex, 8h às 19h · Sáb, 8h às 12h</p>
  </div>
</body></html>
